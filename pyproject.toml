[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdt"
dynamic = ["version"]
description = "Model Development Tool"
authors = [
    {name = "NOAA NWS MDC", email = "example@noaa.gov"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "networkx",
    "xarray",
    "pandas",
    "numpy",
    "monetio @ git+https://github.com/bbakernoaa/monetio.git@547c89b6e5896a3598f7afc0a2ebb2b449e1280a",
    "monet @ git+https://github.com/bbakernoaa/monet.git@0529c0793e4599259d8717f597accec5ec202c21",
    "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats.git@a68a259df08dd9a770983e7754caa39f2797bf60",
    "monet-plots @ git+https://github.com/bbakernoaa/monet-plots.git@d116a63fbe61cf2856b955bf527701629fe26d15",
]

[project.scripts]
mdt = "mdt.cli:main"

[project.optional-dependencies]
prefect = ["prefect>=3.0.0", "prefect-dask"]
dask = ["dask", "dask-jobqueue"]
cubed = ["cubed", "cubed-xarray"]
dev = ["ruff", "pytest", "pytest-mock", "hypothesis", "pytest-cov", "mypy", "types-PyYAML", "types-networkx", "pandas-stubs"]
all = [
    "mdt[prefect]",
    "mdt[dask]",
    "mdt[cubed]",
    "mdt[dev]",
]

[dependency-groups]
lint = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mdt.__version__"}

[tool.semantic_release]
version_variables = ["src/mdt/__init__.py:__version__"]
commit_message = "chore(release): v{version}"
build_command = ""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: downloads real data or calls external services (requires --run-network)",
    "ecflow: requires real ecFlow Python bindings and server (requires --run-ecflow)",
    "hpc: requires a configured HPC scheduler (requires --run-hpc)",
    "slow: long-running integration or data download test",
]

[tool.ruff]
line-length = 148
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "B", "S", "PT", "ARG", "PTH", "RUF"]
ignore = [
    "D100",  # Missing docstring in public module (we will add them, but good to ignore if we miss one)
    "D104",  # Missing docstring in public package
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D401",  # First line should be in imperative mood
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert
    "S102",    # Use of exec in test scaffolding
    "S108",    # Insecure temporary file
    "S110",    # try-except-pass
    "S311",    # Pseudo-random generator acceptable in tests
    "S603",    # Subprocess calls in integration tests
    "S607",    # Partial executable paths in tests
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ARG005",  # Unused lambda argument
    "B007",    # Unused loop control variable in tests
    "F841",    # Assigned but unused in tests/mocks
    "PT019",   # Fixture without value injected as parameter
    "PTH",     # Use Pathlib (we'll allow OS module in tests for now)
    "E402",    # Module level import not at top in segmented test files
    "D205",    # Blank line after summary in test docstrings
    "D102",    # Missing docstring in public method
    "RUF002",  # Ambiguous unicode character
    "RUF015",  # Prefer next(iter())
    "RUF043",  # match= contains metacharacters
    "PT017",   # assertion on exception in except block
]
"scripts/*" = [
    "PTH",     # Utility patch scripts intentionally use os/open style for portability
    "D103",    # Relax public function docstring requirement for script entrypoints
]

[tool.mypy]
# Target 3.12: numpy's type stubs (pulled in transitively via pandas-stubs) use
# PEP 695 `type` statements and PEP 696 TypeVar defaults, which mypy only parses
# when targeting Python >=3.12. Ruff still enforces the py311 syntax floor for our
# own code, so 3.11 runtime support is preserved.
python_version = "3.12"
exclude = "^tests/"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "mdt.engine"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "hypothesis.*",
    "xarray.*",
    "xregrid.*",
    "monetio.*",
    "monet.*",
    "monet_stats.*",
    "monet_plots.*",
    "networkx.*",
    "yaml.*",
    "dask.*",
    "dask_jobqueue.*",
    "prefect.*",
    "prefect_dask.*",
    "ecflow.*",
    "esmpy.*",
    "icechunk.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
